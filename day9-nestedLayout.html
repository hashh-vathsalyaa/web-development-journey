<!DOCTYPE html>
<html lang="en">
<head>
    <title>Nested Layouts Technique</title>
    <style>
        .image1{
            width:70px;
            height:70px;
            object-fit: cover;
            border-radius: 50px;
        }
        .imgBox{
            display:inline-block;
            padding:10px 10px;
            
        }
        .Box2{
            display: inline-block;
            padding:10px 10px;
            vertical-align: top;
        }
        .box{
            width:300px;
            height:95px;
            padding:0px;
        }
        p {
            font-family: Arial;
            padding:0;
            margin:0;
            padding-top:4px;
        }
        .name {
            font-weight: bold;
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="imgBox">
            <img class="image1"src="cheetah.avif">
        </div>

        <div class="Box2">
            <div class="info">
                <p class="name">Oliver</p>
                <p class="title">the cheetah</p>
                <p class="cap">Popular</p>
            </div>
        </div>
    </div>
</body>
</html>
