<!DOCTYPE html>
<html>
    <head>
        <title> div Practice </title>

        <style>
            .red {
                width:100px;
                height:100px;
                background-color: red;
            }

            .green {
                margin-top: 20px;
                width:100px;
                height:100px;
                border-radius:50px;
                background-color:green;
            }

            .box {
                border: 1px solid rgb(150, 150, 150);
                width: 300px;
                padding-left: 15px;
                padding-bottom: 20px;
            }

            .para {
                font-family: Arial;
            }

            .box2 {
                background-color: rgb(33, 33, 33);
                width: 300px;
                padding-left: 15px;
                padding-bottom: 10px;
                padding-top:8px;
            }

            .para1 {
                color: white;
                font-family: Arial;
                font-weight: bold;
                font-size: larger;
                margin-bottom: 2px;
                margin-top: 10px;
            }

            .para2 {
                font-family: Arial;
                color:rgb(160, 160, 160);
                font-size: 13px;
                margin-top: 9px;
                margin-bottom: 4px;
            }
        </style>
    </head>
    <body>
        <div class="red"> </div>
        <div class="green"></div>
        <br>
        <div class="box">
            <p class="para">Satisfied with our service?</p>
            <button class="btn"> Yes </button> <button class="btn"> No </button>
        </div>
        <br>
        <div class="box2">
            <p class="para1">Install YouTube Music</p>
            <p class="para2">Add YouTube Music to your desktop for quick and easy access</p>
        </div>
    </body>
</html>
