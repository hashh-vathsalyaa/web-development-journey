<!DOCTYPE html>
<html>
    <head>
        <title> Images Practice</title>
        <style>
            .image1 {
                width: 200px;
                border-radius: 10px;
                margin-right: 20px;
            }

            .image2 {
                width:200px;
                height: 200px;
                object-fit: cover;
                margin-right: 20px;
            }

            .image3 {
                width: 200px;
                height: 200px;
                object-fit: cover;
                border-radius: 100px;
            }
        </style>
    </head>
    <body>
        <img class="image1" src="cheetah.avif"> 
        <img class="image2" src="cheetah.avif">
        <img class="image3" src="cheetah.avif">
    </body>
</html>
