<!DOCTYPE html>
<html>
    <head>
        <title> Text Box Practice</title>
        <style>
            .textbox1 {
                border: 1px solid rgb(183, 182, 182);
                width: 130px;
                padding-top: 5px;
                padding-bottom: 6px;
                padding-left: 9px;
                border-radius: 5px;
                margin-bottom: 20px;
                font-size: 9px;
            }

            .google {
                border:none;
                width: 250px;
                padding-top: 5px;
                padding-bottom: 6px;
                padding-left: 9px;
                border-radius: 5px;
                margin-bottom: 10px;
                font-size: 9px;
                border-radius:120px;
                box-shadow: 0px 0px 5px 1px rgba(0, 0, 0, 0.15);
                margin-bottom: 20px;
            }
            .email {
                font-family: Arial;
                font-size: 8px;
                color: rgb(83, 81, 81);
                margin-bottom: 2px;

            }
            
            .textBox {
                border: 1px solid;
                border-radius: 2px;
                width: 200px;
            }
            
            .cap {
                font-family: Arial;
                font-size: 8px;
                color: rgb(83, 81, 81);
                margin-bottom: 7px;
            }

            .btn {
                background-color: rgb(45, 60, 193);
                color: white;
                border: none;
                width: 205px;
                height: 25px;
                font-size: 10px;
                border-radius: 12px;
                margin-bottom: 30px;
                cursor: pointer;
            }

            .pfp {
                width: 50px;
                height:50px;
                object-fit: cover;
                vertical-align: middle;
                border-radius: 25px;
            }

            .commentBox {
                border: none;
                font-size: 15px;
                width: 200px;
                vertical-align: middle;
                margin-left: 10px;
                margin-right: 10px;
            }

            .tweet{
                background-color: rgb(16, 158, 219);
                color: white;
                border: none;
                font-weight: bold;
                padding: 8px 15px;
                border-radius: 20px;
                vertical-align: middle;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <input class="textbox1" type="text" placeholder="Search"> <br>
        <input class="google" type="text" placeholder="Search Google or type a URL">
        <p class="email"> Email </p>
        <input class="textBox" type="text">
        <p class="cap"> By clicking Agree & Join, you agree to the Privacy Policy.</p>
        <button class="btn"> Agree & Join </button><br>
        <img class="pfp" src="cheetah.avif">
        <input class="commentBox" type="text" placeholder="What's happening?">
        <button class="tweet"> Tweet</button>
    </body>
</html>
