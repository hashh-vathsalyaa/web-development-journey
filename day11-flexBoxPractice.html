<!DOCTYPE html>
<html lang="en">
<head>
    <title>FlexBox Practice</title>
    <style>
        p{
            font-family: arial;
            margin:0;
        }
    </style>
</head>
<body>
    <div style="
        border: 1px solid lightgrey;
        width: 270px;
        border-radius: 4px;
        padding-left: 10px;
        padding-right: 10px;
        margin-bottom: 20px;
        ">
        <div style=" display:flex; justify-content: space-between; padding:10px 0;">
            <p>Home</p>
            <button style="background-color: rgb(1, 145, 217); color:white; border:none; border-radius: 8px; font-weight: bold;"> 14</button>
        </div>

        <div style="display:flex; justify-content: space-between; padding:10px 0;">
            <p>Notifications</p>
            <button style="background-color: rgb(1, 145, 217); color:white; border:none; border-radius: 8px; font-weight: bold;"> 14</button>
        </div>

        <div style="display:flex; justify-content: space-between; padding:10px 0;">
            <p>Messages</p>
            <button style="background-color: rgb(1, 145, 217); color:white; border:none; border-radius: 8px; font-weight: bold;"> 14</button>
        </div>
    </div>

    <div style="
    display: flex;
    justify-content: space-between;
    background-color: lightcoral;
    padding: 8px 10px;
    align-items: center;
    ">
        <div><p style="color:white; font-size: small; font-weight: bold;">Home</p></div>
        <div style="
        display: flex;
        ">
            <input type="text" placeholder="Search" style="width:350px; border:none; border-radius: 15px; padding: 5px 15px">
        </div>
        <div>
            <button style="background-color:lightcoral; border: 1px solid white; color:white; font-weight: lighter; padding:6px 10px;"> Download </button>
        </div>
    </div>
</body>
</html>
